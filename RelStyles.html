<style>
  .rel-app {
    min-height: 100vh;
    box-sizing: border-box;
    background: #f3f5f8;
    color: #1f2937;
    font-family: Arial, Helvetica, sans-serif;
  }

  .rel-app .rel-header {
    background: #ffffff;
    border-bottom: 1px solid #dfe3e8;
  }

  .rel-app .rel-header-content,
  .rel-app .rel-main {
    width: min(1120px, calc(100% - 64px));
    margin: 0 auto;
  }

  .rel-app .rel-header-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 32px 0 28px;
  }

  .rel-app .rel-header-title {
    min-width: 0;
  }

  .rel-app .rel-header-actions {
    flex: 0 0 auto;
  }

  .rel-app .rel-module-link {
    display: inline-flex;
    min-height: 44px;
    box-sizing: border-box;
    padding: 0 16px;
    align-items: center;
    justify-content: center;
    border: 1px solid #d1d7df;
    border-radius: 8px;
    background: #ffffff;
    color: #1f2937;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
  }

  .rel-app .rel-module-link:focus-visible {
    outline: 2px solid #1f2937;
    outline-offset: 2px;
  }

  .rel-app .rel-eyebrow {
    display: block;
    margin-bottom: 8px;
    color: #566273;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .rel-app .rel-title {
    margin: 0;
    font-size: 30px;
    line-height: 1.2;
  }

  .rel-app .rel-main {
    padding: 48px 0;
  }

  .rel-app .rel-card {
    box-sizing: border-box;
    padding: 32px;
    border: 1px solid #dfe3e8;
    border-radius: 10px;
    background: #ffffff;
    box-shadow: 0 4px 16px rgba(31, 41, 55, 0.05);
  }

  .rel-analysis-card, .rel-import-card { margin-bottom: 20px; }
  .rel-analysis-metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 20px 0 0; }
  .rel-analysis-metric { padding: 12px; border-radius: 7px; background: #f3f5f8; }
  .rel-analysis-metric dt { color: #566273; font-size: 12px; font-weight: 700; }
  .rel-analysis-metric dd { margin: 6px 0 0; font-size: 20px; font-weight: 700; }
  .rel-import-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) auto; gap: 16px; margin-top: 24px; }
  .rel-import-actions { display: flex; align-items: end; }
  .rel-import-file-info { display: flex; flex-wrap: wrap; gap: 12px 28px; margin: 16px 0 0; color: #566273; }
  .rel-import-file-info div { min-width: 0; }
  .rel-import-file-info dt { font-size: 12px; font-weight: 700; }
  .rel-import-file-info dd { overflow-wrap: anywhere; margin: 4px 0 0; color: #1f2937; }
  .rel-import-preview { margin-top: 24px; padding-top: 24px; border-top: 1px solid #e5e7eb; }
  .rel-import-preview h3 { margin: 0 0 16px; font-size: 17px; }
  .rel-import-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0; }
  .rel-import-metric { padding: 12px; border-radius: 7px; background: #f3f5f8; }
  .rel-import-metric dt { color: #566273; font-size: 12px; font-weight: 700; }
  .rel-import-metric dd { margin: 6px 0 0; font-size: 20px; font-weight: 700; }
  .rel-import-confirm { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
  .rel-import-confirm p { margin: 0; color: #566273; }
  .rel-import-invalidos { margin-top: 20px; padding: 14px; border-radius: 7px; background: #fef2f2; color: #7f1d1d; }
  .rel-import-invalidos h4 { margin: 0 0 10px; }
  .rel-import-invalidos ul { margin: 0; padding-left: 20px; }
  .rel-import-invalidos li + li { margin-top: 6px; }

  .rel-summary {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .rel-summary-card {
    min-width: 0;
    box-sizing: border-box;
    padding: 18px;
    border: 1px solid #dfe3e8;
    border-radius: 10px;
    background: #ffffff;
  }

  .rel-summary-card span {
    display: block;
    margin-bottom: 10px;
    color: #566273;
    font-size: 13px;
    font-weight: 700;
  }

  .rel-summary-card strong {
    display: block;
    overflow-wrap: anywhere;
    font-size: 24px;
    line-height: 1.2;
  }

  .rel-summary-card-wide strong {
    font-size: 17px;
  }

  .rel-app .rel-card-title {
    margin: 0 0 10px;
    font-size: 21px;
    line-height: 1.35;
  }

  .rel-app .rel-message {
    margin: 0;
    color: #566273;
    font-size: 16px;
    line-height: 1.6;
  }

  .rel-section-header, .rel-filters, .rel-modal-header, .rel-modal-actions {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .rel-filters { justify-content: flex-start; margin: 28px 0 20px; }
  .rel-filters label { width: min(360px, 100%); }
  .rel-filters label:last-child { width: 180px; }
  .rel-app label { display: grid; gap: 7px; color: #374151; font-size: 14px; font-weight: 700; }
  .rel-app input, .rel-app select, .rel-app textarea {
    box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #cbd2dc;
    border-radius: 7px; background: #fff; color: #1f2937; font: inherit;
  }
  .rel-app input:focus, .rel-app select:focus, .rel-app textarea:focus { outline: 2px solid #2563eb; outline-offset: 1px; }
  .rel-button { min-height: 42px; padding: 0 16px; border: 1px solid #cbd2dc; border-radius: 7px; background: #fff; color: #1f2937; font-weight: 700; cursor: pointer; }
  .rel-button-primary { border-color: #1d4ed8; background: #1d4ed8; color: #fff; }
  .rel-button-link { display: inline-flex; box-sizing: border-box; align-items: center; justify-content: center; color: #1d4ed8; text-decoration: none; }
  .rel-button:disabled { cursor: wait; opacity: .65; }
  .rel-table-wrap { overflow-x: auto; }
  .rel-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rel-table th, .rel-table td { padding: 14px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
  .rel-table th { color: #566273; font-size: 12px; text-transform: uppercase; }
  .rel-table td:last-child, .rel-table th:last-child { text-align: right; }
  .rel-status { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 12px; font-weight: 700; }
  .rel-status-inativo { background: #f3f4f6; color: #4b5563; }
  .rel-action { border: 0; background: none; color: #1d4ed8; font-weight: 700; cursor: pointer; }
  .rel-alert { margin: 16px 0; padding: 12px; border-radius: 7px; background: #eff6ff; color: #1e40af; }
  .rel-alert-error { background: #fef2f2; color: #991b1b; }
  .rel-empty { margin: 24px 0 0; color: #566273; text-align: center; }
  .rel-modal { width: min(520px, calc(100% - 32px)); box-sizing: border-box; padding: 0; border: 0; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .rel-modal::backdrop { background: rgba(17,24,39,.55); }
  .rel-modal form { display: grid; gap: 18px; padding: 26px; }
  .rel-modal h2 { margin: 0; font-size: 21px; }
  .rel-close { border: 0; background: none; color: #566273; font-size: 28px; cursor: pointer; }
  .rel-modal-actions { justify-content: flex-end; margin-top: 4px; }

  @media (max-width: 640px) {
    .rel-app .rel-header-content,
    .rel-app .rel-main {
      width: min(100% - 32px, 1120px);
    }

    .rel-app .rel-header-content {
      gap: 16px;
      padding: 24px 0 20px;
    }

    .rel-app .rel-title {
      font-size: 24px;
    }

    .rel-app .rel-main {
      padding: 24px 0;
    }

    .rel-app .rel-card {
      padding: 24px;
    }
    .rel-import-form, .rel-import-metrics, .rel-analysis-metrics { grid-template-columns: 1fr; }
    .rel-import-actions .rel-button { width: 100%; }
    .rel-import-confirm { align-items: stretch; flex-direction: column; }
    .rel-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .rel-summary-card-wide { grid-column: 1 / -1; }
    .rel-section-header, .rel-filters { align-items: stretch; flex-direction: column; }
    .rel-filters label, .rel-filters label:last-child { width: 100%; }
    .rel-table thead { display: none; }
    .rel-table tr { display: grid; margin-bottom: 12px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; }
    .rel-table td { padding: 5px 0; border: 0; }
    .rel-table td:last-child { text-align: left; }
  }
</style>
