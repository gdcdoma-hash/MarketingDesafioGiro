<script>
  const relContatos = (() => {
    'use strict';
    const etapas = { PARA_CONTATAR: 'Para contatar', AGUARDANDO_RESPOSTA: 'Aguardando resposta', EM_CONVERSA: 'Em conversa', RETORNAR_DEPOIS: 'Retornar depois', FINALIZADO: 'Finalizado', NAO_CONTATAR: 'Não contatar' };
    const situacoes = { NAO_CLASSIFICADO: 'Não classificado', PODE_CONTATAR: 'Pode contatar', NAO_FAZ_DESAFIO: 'Não faz desafio', NAO_E_CICLISTA: 'Não é ciclista', SEM_INTERESSE: 'Sem interesse', NAO_DESEJA_CONTATO: 'Não deseja contato', CONTATO_INADEQUADO: 'Contato inadequado', OUTRO: 'Outro' };
    const regioes = { PARA: 'Pará', IMPERATRIZ: 'Imperatriz', SAO_LUIS: 'São Luís', PINHEIRO: 'Pinheiro', CURURUPU: 'Cururupu', SANTA_INES: 'Santa Inês', BR: 'BR' };
    const ufs = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
    const estado = { pagina: 1, totalPaginas: 1, origensCarregadas: false, contatos: {}, contatosAguardandoSituacao: {}, retornoPendente: false, indicadorAtivo: '' };
    const e = {};
    let buscaTimer = null;

    function mensagem(texto, erro) { e.aviso.textContent = texto || ''; e.aviso.hidden = !texto; e.aviso.classList.toggle('rel-alert-error', !!erro); }
    function filtros() { return { busca: e.busca.value, classificacao: e.classificacao.value, etapa: e.etapa.value, situacao: e.situacao.value, idOrigem: e.origem.value, retornoPendente: estado.retornoPendente, pagina: estado.pagina, porPagina: 50 }; }
    function dataCurta(valor) { if (!valor) return ''; const data = new Date(valor); return Number.isNaN(data.getTime()) ? valor : data.toLocaleDateString('pt-BR'); }
    function valorData(valor) { if (!valor) return ''; const data = new Date(valor); return Number.isNaN(data.getTime()) ? '' : data.toISOString().slice(0, 10); }
    function criar(tag, classe, texto) { const el = document.createElement(tag); if (classe) el.className = classe; if (texto !== undefined) el.textContent = texto; return el; }
    function atualizarIndicador() { if (typeof relResumoOperacional !== 'undefined' && relResumoOperacional.destacarIndicador) relResumoOperacional.destacarIndicador(estado.indicadorAtivo); }
    function limparContatosAguardandoSituacao() { estado.contatosAguardandoSituacao = {}; }
    function filtrarAgora() { limparContatosAguardandoSituacao(); estado.pagina = 1; estado.retornoPendente = false; estado.indicadorAtivo = ''; atualizarIndicador(); carregar(); }
    function filtrarBusca() { window.clearTimeout(buscaTimer); buscaTimer = window.setTimeout(filtrarAgora, 400); }
    function contatoAtendeFiltrosOperacionais(contato) {
      const atendeEtapa = e.etapa.value === 'TODOS'
        || (e.etapa.value === 'PADRAO' && contato.etapa !== 'FINALIZADO' && contato.etapa !== 'NAO_CONTATAR')
        || e.etapa.value === contato.etapa;
      const atendeSituacao = e.situacao.value === 'TODOS' || e.situacao.value === contato.situacao;
      return atendeEtapa && atendeSituacao;
    }

    async function carregar() {
      mensagem('Carregando contatos...');
      try {
        const resposta = await relApiClient.executar('rel_listarContatos', filtros());
        if (!resposta || resposta.status !== 'OK') throw new Error(resposta && resposta.mensagem || 'Não foi possível listar os contatos.');
        renderizar(resposta.dados);
        mensagem('');
      } catch (erro) { mensagem(erro.message, true); }
    }

    function renderizar(dados) {
      estado.pagina = dados.pagina; estado.totalPaginas = dados.totalPaginas; estado.contatos = {};
      if (!estado.origensCarregadas) {
        substituirOrigens(dados.origens || []);
        estado.origensCarregadas = true;
      }
      const contatos = (dados.contatos || []).slice();
      Object.keys(estado.contatosAguardandoSituacao).forEach(telefone => {
        const pendente = estado.contatosAguardandoSituacao[telefone];
        const indice = contatos.findIndex(contato => contato.telefoneNormalizado === telefone);
        if (indice === -1) contatos.push(pendente); else contatos[indice] = pendente;
      });
      e.lista.replaceChildren();
      contatos.forEach(contato => e.lista.appendChild(criarCard(contato)));
      e.vazio.hidden = contatos.length !== 0; e.lista.hidden = contatos.length === 0;
      e.pagina.textContent = 'Página ' + dados.pagina + ' de ' + dados.totalPaginas + ' · ' + dados.total + ' resultados';
      e.anterior.disabled = dados.pagina <= 1; e.proxima.disabled = dados.pagina >= dados.totalPaginas;
      atualizarIndicador();
    }

    function substituirOrigens(origens) {
      const selecaoAtual = e.origem.value;
      const opcoes = [new Option('Todas', '')];
      origens.forEach(origem => opcoes.push(new Option(origem.nomeOrigem, origem.idOrigem)));
      e.origem.replaceChildren(...opcoes);
      e.origem.value = Array.from(e.origem.options).some(opcao => opcao.value === selecaoAtual)
        ? selecaoAtual : '';
    }

    async function atualizarOrigens() {
      try {
        const resposta = await relApiClient.executar('rel_obterOpcoesImportacao');
        if (!resposta || resposta.status !== 'OK') throw new Error(resposta && resposta.mensagem);
        substituirOrigens(resposta.dados.origens || []);
        estado.origensCarregadas = true;
      } catch (erro) {
        mensagem(erro.message || 'Não foi possível atualizar as origens.', true);
      }
    }

    function criarCard(contato) {
      estado.contatos[contato.telefoneNormalizado] = contato;
      const identificado = contato.classificacao === 'IDENTIFICADO_PORTAL';
      const artigo = criar('article', 'rel-contact-row etapa-' + contato.etapa.toLowerCase());
      artigo.dataset.telefone = contato.telefoneNormalizado;

      const identidade = criar('div', 'rel-contact-identity');
      const topo = criar('div', 'rel-contact-phone-line');
      topo.appendChild(criar('b', 'rel-contact-phone', contato.telefoneExibicao));
      const copiarBtn = criar('button', 'rel-button rel-copy-button', 'Copiar');
      copiarBtn.type = 'button'; copiarBtn.dataset.copiar = ''; copiarBtn.setAttribute('aria-label', 'Copiar contato ' + contato.telefoneExibicao);
      topo.appendChild(copiarBtn);
      const whatsappBtn = criar('button', 'rel-button rel-whatsapp-button', '💬 WhatsApp');
      whatsappBtn.type = 'button'; whatsappBtn.dataset.whatsapp = ''; whatsappBtn.setAttribute('aria-label', 'Abrir WhatsApp de ' + contato.telefoneExibicao);
      whatsappBtn.disabled = !normalizarTelefoneWhatsApp(contato.telefoneNormalizado);
      topo.appendChild(whatsappBtn); identidade.appendChild(topo);
      identidade.appendChild(criar('strong', contato.nomeExibicao === 'Nome não informado' ? 'rel-contact-name is-empty' : 'rel-contact-name', contato.nomeExibicao));
      identidade.appendChild(criar('span', contato.cidadeUfExibicao === 'Cidade não informada' ? 'rel-contact-city is-empty' : 'rel-contact-city', contato.cidadeUfExibicao));
      const chips = criar('div', 'rel-contact-chips');
      const nomeGoogle = contato.origemNomeExibicao === 'GOOGLE_CONTATOS';
      chips.appendChild(criar('span', 'rel-contact-chip rel-contact-badge ' + (identificado ? 'is-portal' : ''), identificado ? 'Identificado no Portal' : (nomeGoogle ? 'Na sua agenda' : 'Contato novo')));
      const origens = contato.origens && contato.origens.length ? contato.origens : ['Origem não informada'];
      origens.forEach(origem => chips.appendChild(criar('span', 'rel-contact-chip', origem)));
      identidade.appendChild(chips);

      const acoes = criar('div', 'rel-contact-actions');
      const etapaWrap = criar('label', 'rel-contact-action-field'); etapaWrap.appendChild(criar('span', '', 'Etapa'));
      const select = criar('select'); select.dataset.etapa = ''; select.setAttribute('aria-label', 'Etapa');
      Object.keys(etapas).forEach(etapa => { const opt = new Option(etapas[etapa], etapa); opt.selected = etapa === contato.etapa; select.add(opt); });
      etapaWrap.appendChild(select); acoes.appendChild(etapaWrap);
      const situacaoWrap = criar('label', 'rel-contact-action-field'); situacaoWrap.appendChild(criar('span', '', 'Situação'));
      const situacaoSelect = criar('select'); situacaoSelect.dataset.situacao = ''; situacaoSelect.setAttribute('aria-label', 'Situação');
      Object.keys(situacoes).forEach(situacao => { const opt = new Option(situacoes[situacao], situacao); opt.selected = situacao === contato.situacao; situacaoSelect.add(opt); });
      situacaoWrap.appendChild(situacaoSelect); acoes.appendChild(situacaoWrap);
      const retornoWrap = criar('label', 'rel-contact-return-field');
      retornoWrap.hidden = contato.etapa !== 'RETORNAR_DEPOIS'; retornoWrap.appendChild(criar('span', '', 'Retorno'));
      const retorno = criar('input'); retorno.dataset.retorno = ''; retorno.type = 'date'; retorno.value = valorData(contato.proximoRetorno); retorno.setAttribute('aria-label', 'Próximo retorno');
      retornoWrap.appendChild(retorno); acoes.appendChild(retornoWrap);
      const editar = criar('button', 'rel-button', 'Informar dados'); editar.type = 'button'; editar.dataset.editar = ''; acoes.appendChild(editar);
      artigo.appendChild(identidade); artigo.appendChild(acoes);
      return artigo;
    }

    function textoCopiar(contato) { return [contato.telefoneExibicao, contato.nomeExibicao === 'Nome não informado' ? '' : contato.nomeExibicao, contato.cidadeUfExibicao === 'Cidade não informada' ? '' : contato.cidadeUfExibicao].filter(Boolean).join(' | '); }
    function normalizarTelefoneWhatsApp(telefone) {
      const numero = String(telefone || '').replace(/\D/g, '');
      const numeroComPais = numero.indexOf('55') === 0 ? numero : '55' + numero;
      return /^55\d{10,11}$/.test(numeroComPais) ? numeroComPais : '';
    }
    function abrirWhatsApp(telefone) {
      const numero = normalizarTelefoneWhatsApp(telefone);
      if (!numero) return;
      const link = document.createElement('a');
      link.href = 'whatsapp://send?phone=' + numero;
      link.target = '_blank';
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      link.remove();
    }
    async function copiar(contato, botao) {
      const texto = textoCopiar(contato);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(texto);
        else { const area = document.createElement('textarea'); area.value = texto; area.setAttribute('readonly', ''); area.style.position = 'fixed'; area.style.opacity = '0'; document.body.appendChild(area); area.select(); if (!document.execCommand('copy')) throw new Error('Cópia indisponível.'); area.remove(); }
        const original = botao.textContent; botao.textContent = 'Copiado'; setTimeout(() => { botao.textContent = original; }, 1600);
      } catch (erro) { mensagem('Não foi possível copiar o contato.', true); }
    }

    async function alterarEtapa(linha, select) {
      const contato = estado.contatos[linha.dataset.telefone]; const retorno = linha.querySelector('[data-retorno]'); const retornoWrap = linha.querySelector('.rel-contact-return-field'); const anterior = contato.etapa;
      retornoWrap.hidden = select.value !== 'RETORNAR_DEPOIS';
      if (select.value === 'RETORNAR_DEPOIS' && !retorno.value) { mensagem('Informe a data do próximo retorno.', true); retorno.focus(); return; }
      let limpar = false;
      if (select.value === 'PARA_CONTATAR' && contato.proximoRetorno) { limpar = window.confirm('Deseja limpar a data do próximo retorno?'); if (!limpar) { select.value = anterior; retornoWrap.hidden = anterior !== 'RETORNAR_DEPOIS'; return; } }
      select.disabled = true;
      try {
        const resposta = await relApiClient.executar('rel_atualizarEtapaContato', { telefoneNormalizado: contato.telefoneNormalizado, etapa: select.value, proximoRetorno: retorno.value, limparProximoRetorno: limpar });
        if (!resposta || resposta.status !== 'OK') throw new Error(resposta && resposta.mensagem || 'Falha ao atualizar.');
        contato.etapa = resposta.dados.etapa; contato.proximoRetorno = resposta.dados.proximoRetorno || ''; retorno.value = valorData(contato.proximoRetorno);
        linha.className = 'rel-contact-row etapa-' + contato.etapa.toLowerCase(); retornoWrap.hidden = contato.etapa !== 'RETORNAR_DEPOIS';
        const aguardaSituacao = contato.etapa === 'NAO_CONTATAR' && contato.situacao === 'NAO_CLASSIFICADO';
        if (aguardaSituacao) estado.contatosAguardandoSituacao[contato.telefoneNormalizado] = contato;
        else delete estado.contatosAguardandoSituacao[contato.telefoneNormalizado];
        mensagem(aguardaSituacao ? 'Etapa atualizada. Selecione a situação deste contato.' : 'Etapa atualizada.');
        relResumoOperacional.carregar();
        if (!aguardaSituacao && (!contatoAtendeFiltrosOperacionais(contato) || estado.retornoPendente)) carregar();
      } catch (erro) { select.value = anterior; retornoWrap.hidden = anterior !== 'RETORNAR_DEPOIS'; mensagem(erro.message, true); } finally { select.disabled = false; }
    }

    async function alterarSituacao(linha, select) {
      const contato = estado.contatos[linha.dataset.telefone]; const anterior = contato.situacao || 'NAO_CLASSIFICADO';
      select.disabled = true;
      try {
        const resposta = await relApiClient.executar('rel_atualizarSituacaoContato', { telefoneNormalizado: contato.telefoneNormalizado, situacao: select.value });
        if (!resposta || resposta.status !== 'OK') throw new Error(resposta && resposta.mensagem || 'Falha ao atualizar a situação.');
        contato.situacao = resposta.dados.situacao; select.value = contato.situacao; mensagem('Situação atualizada.');
        if (contato.situacao !== 'NAO_CLASSIFICADO') delete estado.contatosAguardandoSituacao[contato.telefoneNormalizado];
        if (!contatoAtendeFiltrosOperacionais(contato) || estado.retornoPendente) carregar();
      } catch (erro) { select.value = anterior; mensagem(erro.message, true); } finally { select.disabled = false; }
    }

    async function abrirEdicao(contato) {
      e.form.reset(); e.telefone.value = contato.telefoneNormalizado; e.nome.value = contato.nomeContato || ''; e.uf.value = contato.uf || '';
      e.regiao.value = contato.regiao || '';
      await carregarCidades();
      if (contato.cidade && !Array.from(e.cidade.options).some(opcao => opcao.value === contato.cidade)) e.cidade.add(new Option(contato.cidade, contato.cidade), e.cidade.options[e.cidade.options.length - 1]);
      e.cidade.value = contato.cidade || ''; e.ciclista.value = contato.eCiclista || 'NAO_CONFIRMADO'; e.modalidade.value = contato.modalidade || 'NAO_INFORMADO'; e.observacao.value = contato.observacao || '';
      e.formAviso.hidden = true; e.modal.showModal();
    }
    async function carregarCidades() {
      e.cidade.innerHTML = '<option value="">Selecione</option><option value="__NOVA__">Nova cidade</option>';
      if (!e.uf.value || !e.regiao.value) return;
      const resposta = await relApiClient.executar('rel_listarOpcoesCidades', { uf: e.uf.value, regiao: e.regiao.value });
      if (resposta && resposta.status === 'OK') resposta.dados.cidades.forEach(item => e.cidade.add(new Option(item.cidade, item.cidade), e.cidade.options[e.cidade.options.length - 1]));
    }
    function avisoForm(texto, erro) { e.formAviso.textContent = texto || ''; e.formAviso.hidden = !texto; e.formAviso.classList.toggle('rel-alert-error', !!erro); }
    async function cadastrarCidade() {
      const cidade = e.novaCidade.value.trim(); if (!e.uf.value || !e.regiao.value || !cidade) { avisoForm('Informe UF, região e nova cidade.', true); return; }
      const resposta = await relApiClient.executar('rel_cadastrarCidade', { uf: e.uf.value, regiao: e.regiao.value, cidade: cidade });
      if (!resposta || resposta.status !== 'OK') { avisoForm(resposta && resposta.mensagem || 'Falha ao cadastrar cidade.', true); return; }
      await carregarCidades(); e.cidade.value = cidade; e.novaCidadeCampos.hidden = true; avisoForm('Cidade cadastrada.');
    }
    async function salvar(evento) {
      evento.preventDefault(); const cidade = e.cidade.value === '__NOVA__' ? '' : e.cidade.value;
      if (e.cidade.value === '__NOVA__') { avisoForm('Cadastre a nova cidade antes de salvar.', true); return; }
      if (!relOperacao.iniciar('salvar-contato', e.salvar, 'Salvando...')) return;
      try {
        const resposta = await relApiClient.executar('rel_salvarDadosContato', { telefoneNormalizado: e.telefone.value, nomeContato: e.nome.value, uf: e.uf.value, regiao: e.regiao.value, cidade: cidade, eCiclista: e.ciclista.value, modalidade: e.modalidade.value, observacao: e.observacao.value });
        if (!resposta || resposta.status !== 'OK') throw new Error(resposta && resposta.mensagem || 'Falha ao salvar.');
        e.modal.close(); mensagem('Dados do contato salvos.'); relResumoOperacional.carregar(); carregar();
      } catch (erro) { avisoForm(erro.message, true); } finally { relOperacao.finalizar(); }
    }
    function limparFiltros() { limparContatosAguardandoSituacao(); e.busca.value = ''; e.classificacao.value = 'TODOS'; e.etapa.value = 'PADRAO'; e.situacao.value = 'TODOS'; e.origem.value = ''; estado.pagina = 1; estado.retornoPendente = false; estado.indicadorAtivo = ''; atualizarIndicador(); carregar(); }
    function aplicarIndicador(indicador) {
      limparContatosAguardandoSituacao();
      e.busca.value = ''; e.classificacao.value = 'TODOS'; e.situacao.value = 'TODOS'; e.origem.value = ''; estado.pagina = 1; estado.indicadorAtivo = indicador;
      estado.retornoPendente = indicador === 'RETORNAR_HOJE'; e.etapa.value = estado.retornoPendente ? 'TODOS' : indicador;
      atualizarIndicador(); carregar();
    }

    function iniciar() {
      Object.assign(e, { filtros: document.querySelector('#rel-contatos-filtros'), busca: document.querySelector('#rel-contatos-busca'), classificacao: document.querySelector('#rel-contatos-classificacao'), etapa: document.querySelector('#rel-contatos-etapa'), situacao: document.querySelector('#rel-contatos-situacao'), origem: document.querySelector('#rel-contatos-origem'), limpar: document.querySelector('#rel-contatos-limpar'), aviso: document.querySelector('#rel-contatos-aviso'), lista: document.querySelector('#rel-contatos-lista'), vazio: document.querySelector('#rel-contatos-vazio'), anterior: document.querySelector('#rel-contatos-anterior'), proxima: document.querySelector('#rel-contatos-proxima'), pagina: document.querySelector('#rel-contatos-pagina'), modal: document.querySelector('#rel-contato-modal'), form: document.querySelector('#rel-contato-form'), telefone: document.querySelector('#rel-contato-telefone'), nome: document.querySelector('#rel-contato-nome'), uf: document.querySelector('#rel-contato-uf'), regiao: document.querySelector('#rel-contato-regiao'), cidade: document.querySelector('#rel-contato-cidade'), novaCidadeCampos: document.querySelector('#rel-nova-cidade-campos'), novaCidade: document.querySelector('#rel-nova-cidade'), cadastrarCidade: document.querySelector('#rel-cadastrar-cidade'), ciclista: document.querySelector('#rel-contato-ciclista'), modalidade: document.querySelector('#rel-contato-modalidade'), observacao: document.querySelector('#rel-contato-observacao'), formAviso: document.querySelector('#rel-contato-form-aviso'), salvar: document.querySelector('#rel-contato-salvar') });
      ufs.forEach(uf => e.uf.add(new Option(uf, uf)));
      e.filtros.addEventListener('submit', evento => evento.preventDefault()); e.busca.addEventListener('input', filtrarBusca); [e.classificacao, e.etapa, e.situacao, e.origem].forEach(campo => campo.addEventListener('change', filtrarAgora)); e.limpar.addEventListener('click', limparFiltros);
      e.anterior.addEventListener('click', () => { limparContatosAguardandoSituacao(); estado.pagina--; carregar(); }); e.proxima.addEventListener('click', () => { limparContatosAguardandoSituacao(); estado.pagina++; carregar(); });
      e.lista.addEventListener('click', evento => { const linha = evento.target.closest('.rel-contact-row'); if (!linha) return; const contato = estado.contatos[linha.dataset.telefone]; if (evento.target.matches('[data-copiar]')) copiar(contato, evento.target); if (evento.target.matches('[data-whatsapp]')) abrirWhatsApp(contato.telefoneNormalizado); if (evento.target.matches('[data-editar]')) abrirEdicao(contato); });
      e.lista.addEventListener('change', evento => { const linha = evento.target.closest('.rel-contact-row'); if (evento.target.matches('[data-etapa]')) alterarEtapa(linha, evento.target); if (evento.target.matches('[data-situacao]')) alterarSituacao(linha, evento.target); if (evento.target.matches('[data-retorno]')) { const select = linha.querySelector('[data-etapa]'); if (select.value === 'RETORNAR_DEPOIS') alterarEtapa(linha, select); } });
      e.uf.addEventListener('change', carregarCidades); e.regiao.addEventListener('change', carregarCidades); e.cidade.addEventListener('change', () => { e.novaCidadeCampos.hidden = e.cidade.value !== '__NOVA__'; });
      e.cadastrarCidade.addEventListener('click', cadastrarCidade); e.form.addEventListener('submit', salvar); document.querySelectorAll('[data-contato-fechar]').forEach(botao => botao.addEventListener('click', () => e.modal.close()));
      carregar();
    }
    return Object.freeze({ iniciar: iniciar, carregar: carregar, atualizarOrigens: atualizarOrigens, textoCopiar: textoCopiar, aplicarIndicador: aplicarIndicador, limparFiltros: limparFiltros });
  })();
</script>
