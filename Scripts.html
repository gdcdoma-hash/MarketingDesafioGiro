<script>

let dadosAtuais = null;
let filtroDivulgadoresAtual = 'ATIVO';


document.addEventListener('DOMContentLoaded', () => {
  carregarDados('');
});


function carregarDados(periodo) {
  document.getElementById('conteudo').innerHTML =
    '<div class="carregando">Carregando dados...</div>';

  google.script.run
    .withSuccessHandler(renderizar)
    .withFailureHandler(erro => {
      console.error(erro);

      document.getElementById('conteudo').innerHTML =
        '<div class="erro">Não foi possível carregar os dados.</div>';
    })
    .obterDadosPainel(periodo);
}


function renderizar(dados) {
  dadosAtuais = dados;

  renderizarPeriodos(dados);

  const principais = renderizarPrincipais(dados.principaisOrigens);
  const metricasPorTipo = renderizarMetricas(dados.metricasPorTipo);
  const metricasPorCidade = renderizarMetricas(dados.metricasPorCidade);
  const metricasPorUf = renderizarMetricas(dados.metricasPorUf);
  const divulgadores = filtrarDivulgadores(dados.divulgadores);

  document.getElementById('conteudo').innerHTML = `
    <section class="meta-card">
      <div class="meta-topo">

        <div>
          <div class="meta-label">
            Meta do período
          </div>

          <div class="meta-numero">
            ${dados.totalPeriodo} / ${dados.meta}
          </div>
        </div>

        <div class="meta-percentual">
          ${Number(dados.percentualMeta || 0).toFixed(1)}%
        </div>

      </div>

      <div class="barra">
        <div
          class="barra-preenchida"
          style="width:${Math.min(
            100,
            Number(dados.percentualMeta || 0)
          )}%">
        </div>
      </div>
    </section>

    <section class="resumos">

      <div class="resumo-card">
        <div class="resumo-numero">
          ${dados.totalAtribuidas}
        </div>

        <div class="resumo-label">
          Inscrições com origem identificada
        </div>
      </div>

      <div class="resumo-card">
        <div class="resumo-numero">
          ${dados.totalDireto}
        </div>

        <div class="resumo-label">
          Direto / sem referência
        </div>
      </div>

    </section>

    <nav class="navegacao">

      <button
        class="nav-btn ativa"
        onclick="abrirAba('painel', this)">
        Painel
      </button>

      <button
        class="nav-btn"
        onclick="abrirAba('divulgadores', this)">
        Divulgadores
      </button>

    </nav>

    <section
      id="painel"
      class="secao ativa">

      <div class="secao-cabecalho">

        <h2 class="secao-titulo">
          Principais origens
        </h2>

        <div class="secao-info">
          ${esc(dados.periodoSelecionado || '')}
        </div>

      </div>

      ${principais}

      <div class="metricas-painel">
        ${renderizarBlocoMetricas('Por tipo', metricasPorTipo)}
        ${renderizarBlocoMetricas('Por cidade', metricasPorCidade)}
        ${renderizarBlocoMetricas('Por UF', metricasPorUf)}
      </div>

    </section>

    <section
      id="divulgadores"
      class="secao">

      <div class="secao-cabecalho">

        <h2 class="secao-titulo">
          Divulgadores
        </h2>

        <div
          id="contador-divulgadores"
          class="secao-info">
          ${textoContadorDivulgadores(divulgadores.length)}
        </div>

      </div>

      <div class="filtros-divulgadores" role="group" aria-label="Filtrar divulgadores por status">
        ${renderizarFiltrosDivulgadores()}
      </div>

      <div id="lista-divulgadores">
        ${renderizarDivulgadores(divulgadores)}
      </div>

    </section>
  `;
}


function renderizarMetricas(lista) {
  if (!Array.isArray(lista) || !lista.length) {
    return '<div class="metrica-vazia">Sem inscrições neste período.</div>';
  }

  return lista.map(item => `
    <div class="metrica-linha">
      <span class="metrica-nome">${esc(item.nome)}</span>
      <strong class="metrica-numero">${item.inscricoes}</strong>
    </div>
  `).join('');
}


function renderizarBlocoMetricas(titulo, conteudo) {
  return `
    <section class="metrica-card">
      <h3 class="metrica-titulo">${esc(titulo)}</h3>
      <div class="metrica-lista">${conteudo}</div>
    </section>
  `;
}


function renderizarPeriodos(dados) {
  const select = document.getElementById('periodo-configuracoes');

  document.getElementById('periodo-atual').textContent =
    dados.periodoSelecionado || '';

  select.innerHTML = dados.periodos
    .map(periodo => `
      <option
        value="${esc(periodo)}"
        ${periodo === dados.periodoSelecionado
          ? 'selected'
          : ''}>
        ${esc(periodo)}
      </option>
    `)
    .join('');
}


function abrirConfiguracoes() {
  if (dadosAtuais) {
    renderizarPeriodos(dadosAtuais);
  }

  document.getElementById('modal-configuracoes').classList.remove('hidden');
}


function fecharConfiguracoes() {
  document.getElementById('modal-configuracoes').classList.add('hidden');
}


function aplicarConfiguracoes() {
  const periodo = document.getElementById('periodo-configuracoes').value;

  fecharConfiguracoes();
  carregarDados(periodo);
}


function renderizarPrincipais(lista) {
  if (!lista.length) {
    return `
      <div class="vazio">
        Ainda não existem inscrições atribuídas neste período.
      </div>
    `;
  }

  return lista.map(item => `
    <article class="card-origem">

      <div class="origem-topo">

        <div class="origem-info">

          <div class="origem-nome">
            ${esc(item.nome)}
          </div>

          <span class="origem-tipo">
            ${esc(item.tipo)}
          </span>

        </div>

        <div class="origem-qtd">

          <div class="origem-numero">
            ${item.inscricoes}
          </div>

          <div class="origem-legenda">
            ${item.inscricoes === 1
              ? 'inscrição'
              : 'inscrições'}
          </div>

        </div>

      </div>

    </article>
  `).join('');
}


function renderizarDivulgadores(lista) {
  if (!lista.length) {
    return `
      <div class="vazio">
        Nenhum divulgador cadastrado.
      </div>
    `;
  }

  return lista.map(item => {
    const ativo = String(item.status || '').toUpperCase() === 'ATIVO';

    return `
    <article class="card-origem">

      <div class="origem-topo">

        <div class="origem-info">

          <div class="origem-nome-com-status">
            <span
              class="indicador-status ${ativo ? 'ativo' : 'inativo'}"
              role="img"
              aria-label="${ativo ? 'Ativo' : 'Inativo'}">
            </span>
            <div class="origem-nome">
              ${esc(item.nome || item.ref)}
            </div>
          </div>

          ${
            item.cidadeUf
              ? `
                <div class="origem-cidade">
                  ${esc(item.cidadeUf)}
                </div>
              `
              : ''
          }

          <span class="origem-tipo">
            ${esc(item.tipo || '-')}
          </span>

        </div>

        <div class="origem-qtd">

          <div class="origem-numero">
            ${item.inscricoes}
          </div>

          <div class="origem-legenda">
            ${item.inscricoes === 1
              ? 'inscrição'
              : 'inscrições'}
          </div>

        </div>

      </div>

      <div class="origem-historico">
        Histórico: ${item.totalHistorico || 0}
        ${(item.totalHistorico || 0) === 1 ? 'inscrição' : 'inscrições'}
      </div>

      <div class="acoes-divulgador ${ativo ? '' : 'inativo'}">
        ${ativo ? `
          <button
            class="btn-copiar"
            onclick="copiarLink(
              '${escJs(item.link)}',
              this
            )">
            COPIAR LINK
          </button>
        ` : ''}

        <button
          class="btn-status ${ativo ? 'inativar' : 'reativar'}"
          onclick="alterarStatusDivulgador(
            '${escJs(item.ref)}',
            '${ativo ? 'INATIVO' : 'ATIVO'}',
            this
          )">
          ${ativo ? 'INATIVAR' : 'REATIVAR'}
        </button>
      </div>

    </article>
  `;
  }).join('');
}


function filtrarDivulgadores(lista) {
  if (filtroDivulgadoresAtual === 'TODOS') {
    return lista;
  }

  return lista.filter(item =>
    String(item.status || '').toUpperCase() === filtroDivulgadoresAtual
  );
}


function renderizarFiltrosDivulgadores() {
  return [
    { valor: 'ATIVO', texto: 'ATIVOS' },
    { valor: 'INATIVO', texto: 'INATIVOS' },
    { valor: 'TODOS', texto: 'TODOS' }
  ].map(filtro => {
    const selecionado = filtro.valor === filtroDivulgadoresAtual;

    return `
      <button
        type="button"
        class="filtro-divulgadores-btn ${selecionado ? 'ativo' : ''}"
        aria-pressed="${selecionado}"
        onclick="alterarFiltroDivulgadores('${filtro.valor}')">
        ${filtro.texto}
      </button>
    `;
  }).join('');
}


function textoContadorDivulgadores(total) {
  if (filtroDivulgadoresAtual === 'ATIVO') {
    return `${total} ${total === 1 ? 'ativo' : 'ativos'}`;
  }

  if (filtroDivulgadoresAtual === 'INATIVO') {
    return `${total} ${total === 1 ? 'inativo' : 'inativos'}`;
  }

  return `${total} ${total === 1 ? 'cadastrado' : 'cadastrados'}`;
}


function alterarFiltroDivulgadores(filtro) {
  filtroDivulgadoresAtual = filtro;
  atualizarListaDivulgadores();
}


function atualizarListaDivulgadores() {
  const divulgadores = filtrarDivulgadores(dadosAtuais.divulgadores);

  document.querySelector('.filtros-divulgadores').innerHTML =
    renderizarFiltrosDivulgadores();
  document.getElementById('contador-divulgadores').textContent =
    textoContadorDivulgadores(divulgadores.length);
  document.getElementById('lista-divulgadores').innerHTML =
    renderizarDivulgadores(divulgadores);
}


function alterarStatusDivulgador(ref, novoStatus, botao) {
  if (
    novoStatus === 'INATIVO' &&
    !window.confirm('Deseja inativar este divulgador?')
  ) {
    return;
  }

  const textoOriginal = botao.textContent;
  botao.disabled = true;
  botao.textContent = 'SALVANDO...';

  google.script.run
    .withSuccessHandler(res => {
      if (!res || res.status !== 'OK') {
        botao.disabled = false;
        botao.textContent = textoOriginal;
        window.alert(
          res && res.mensagem
            ? res.mensagem
            : 'Não foi possível atualizar o status.'
        );
        return;
      }

      const divulgador = dadosAtuais.divulgadores.find(item =>
        String(item.ref) === String(ref)
      );

      if (divulgador) {
        divulgador.status = res.novoStatus;
      }

      atualizarListaDivulgadores();
    })
    .withFailureHandler(erro => {
      console.error(erro);
      botao.disabled = false;
      botao.textContent = textoOriginal;
      window.alert('Não foi possível atualizar o status.');
    })
    .alterarStatusOrigemMarketing(ref, novoStatus);
}


function abrirAba(id, botao) {
  document
    .querySelectorAll('.secao')
    .forEach(el => el.classList.remove('ativa'));

  document
    .querySelectorAll('.nav-btn')
    .forEach(el => el.classList.remove('ativa'));

  const secao = document.getElementById(id);

  if (secao) {
    secao.classList.add('ativa');
  }

  botao.classList.add('ativa');
}


function copiarLink(link, botao) {
  if (!link) return;

  const copiar =
    navigator.clipboard &&
    navigator.clipboard.writeText
      ? navigator.clipboard.writeText(link)
      : Promise.reject();

  copiar
    .then(() => mostrarLinkCopiado(botao))
    .catch(() => copiarLinkFallback(link, botao));
}


function copiarLinkFallback(link, botao) {
  const area = document.createElement('textarea');

  area.value = link;
  area.style.position = 'fixed';
  area.style.opacity = '0';

  document.body.appendChild(area);

  area.focus();
  area.select();

  try {
    document.execCommand('copy');
    mostrarLinkCopiado(botao);

  } catch (e) {
    window.prompt('Copie o link:', link);
  }

  document.body.removeChild(area);
}


function mostrarLinkCopiado(botao) {
  const textoOriginal =
    botao.dataset.textoOriginal ||
    botao.textContent;

  botao.dataset.textoOriginal = textoOriginal;

  botao.textContent = 'LINK COPIADO ✓';
  botao.classList.add('copiado');

  setTimeout(() => {
    botao.textContent = textoOriginal;
    botao.classList.remove('copiado');
  }, 1600);
}


function esc(valor) {
  return String(valor || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function escJs(valor) {
  return String(valor || '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r/g, '')
    .replace(/\n/g, '');
}
let novoDivulgadorAtual = null;


function abrirNovoDivulgador() {
  novoDivulgadorAtual = null;

  document.getElementById(
  'busca-participante'
).value = '';

limparResultadosBusca();

  document.getElementById('novo-tipo').value = 'PARTICIPANTE';


  document
    .getElementById('etapa-busca-divulgador')
    .classList.remove('hidden');

  document
    .getElementById('etapa-confirmar-divulgador')
    .classList.add('hidden');

  document
    .getElementById('etapa-revisar-divulgador')
    .classList.add('hidden');

  document
    .getElementById('etapa-sucesso-divulgador')
    .classList.add('hidden');

  ocultarMensagemDivulgador();

  document
    .getElementById('modal-divulgador')
    .classList.remove('hidden');

  setTimeout(() => {
    
      document
  .getElementById('busca-participante')
  .focus();
  }, 100);
}


function fecharNovoDivulgador() {
  document
    .getElementById('modal-divulgador')
    .classList.add('hidden');

  novoDivulgadorAtual = null;
}


function voltarBuscaDivulgador() {
  novoDivulgadorAtual = null;

  document
    .getElementById('etapa-confirmar-divulgador')
    .classList.add('hidden');

  document
    .getElementById('etapa-busca-divulgador')
    .classList.remove('hidden');

  ocultarMensagemDivulgador();
}


function buscarNovoDivulgador() {
  const termo = document
    .getElementById('busca-participante')
    .value
    .trim();

  if (!termo) {
    mostrarMensagemDivulgador(
      'Digite um nome ou código.'
    );

    return;
  }

  const botao = document.getElementById(
    'btn-buscar-divulgador'
  );

  botao.disabled = true;
  botao.textContent = 'BUSCANDO...';

  ocultarMensagemDivulgador();
  limparResultadosBusca();

  google.script.run
    .withSuccessHandler(res => {
      botao.disabled = false;
      botao.textContent = 'BUSCAR';

      if (!res || res.status !== 'OK') {
        mostrarMensagemDivulgador(
          res && res.mensagem
            ? res.mensagem
            : 'Nenhum participante foi encontrado com esse código.'
        );

        return;
      }

      if (res.tipoResultado === 'DIVULGADOR' && res.divulgador) {
        mostrarResumoDivulgador(res.divulgador, 'Divulgador já cadastrado');
        return;
      }

      const resultados =
        Array.isArray(res.resultados)
          ? res.resultados
          : [];

      if (resultados.length === 1) {
        selecionarPessoaMarketing(
          resultados[0]
        );

        return;
      }

      renderizarResultadosBusca(resultados);
    })
    .withFailureHandler(erro => {
      console.error(erro);

      botao.disabled = false;
      botao.textContent = 'BUSCAR';

      mostrarMensagemDivulgador(
        'Não foi possível realizar a busca.'
      );
    })
    .buscarDivulgadorOuPessoaMarketing(
      termo,
      dadosAtuais ? dadosAtuais.periodoSelecionado : ''
    );
}

function salvarNovoDivulgador() {
  if (!novoDivulgadorAtual) return;

  const tipo = document
    .getElementById('novo-tipo')
    .value;

  document.getElementById('confirmar-nome').textContent =
    novoDivulgadorAtual.nome || '';
  document.getElementById('confirmar-codigo').textContent =
    novoDivulgadorAtual.idDgmb || '';
  document.getElementById('confirmar-tipo').textContent = tipo;

  document
    .getElementById('etapa-confirmar-divulgador')
    .classList.add('hidden');
  document
    .getElementById('etapa-revisar-divulgador')
    .classList.remove('hidden');

  ocultarMensagemDivulgador();
}


function voltarEdicaoDivulgador() {
  document
    .getElementById('etapa-revisar-divulgador')
    .classList.add('hidden');
  document
    .getElementById('etapa-confirmar-divulgador')
    .classList.remove('hidden');

  ocultarMensagemDivulgador();
}


function confirmarNovoDivulgador() {
  if (!novoDivulgadorAtual) return;

  const tipo = document
    .getElementById('novo-tipo')
    .value;

  const botao = document.getElementById(
    'btn-confirmar-divulgador'
  );

  botao.disabled = true;
  botao.textContent = 'SALVANDO...';

  ocultarMensagemDivulgador();

  google.script.run
    .withSuccessHandler(res => {
      botao.disabled = false;
      botao.textContent = 'CONFIRMAR';

      if (!res || res.status !== 'OK') {
        mostrarMensagemDivulgador(
          res && res.mensagem
            ? res.mensagem
            : 'Não foi possível salvar.'
        );

        return;
      }

      mostrarResumoDivulgador(
        res.divulgador || res,
        'Novo divulgador cadastrado'
      );

      carregarDados(
        dadosAtuais
          ? dadosAtuais.periodoSelecionado
          : ''
      );
    })
    .withFailureHandler(erro => {
      console.error(erro);

      botao.disabled = false;
      botao.textContent = 'CONFIRMAR';

      mostrarMensagemDivulgador(
        'Não foi possível salvar o divulgador.'
      );
    })
    .salvarDivulgadorMarketing({
      idDgmb: novoDivulgadorAtual.idDgmb,
      tipo: tipo,
      periodo: dadosAtuais ? dadosAtuais.periodoSelecionado : ''
    });
}


function mostrarResumoDivulgador(divulgador, titulo) {
  document.getElementById('sucesso-titulo').textContent = titulo;
  document.getElementById('sucesso-nome').textContent = divulgador.nome || '';
  document.getElementById('sucesso-codigo').textContent =
    divulgador.idDgmb || divulgador.ref || '';
  document.getElementById('sucesso-cidade').textContent = divulgador.cidadeUf || '-';
  document.getElementById('sucesso-tipo').textContent = divulgador.tipo || '-';
  document.getElementById('sucesso-status').textContent = divulgador.status || '-';
  document.getElementById('sucesso-inscricoes').textContent =
    Number(divulgador.inscricoes || 0);
  document.getElementById('sucesso-link').textContent = divulgador.link || '';

  const botaoCopiar = document.getElementById('btn-copiar-novo-link');
  botaoCopiar.onclick = () => copiarLink(divulgador.link, botaoCopiar);

  document
    .querySelectorAll('#modal-divulgador [id^="etapa-"]')
    .forEach(etapa => etapa.classList.add('hidden'));

  document
    .getElementById('etapa-sucesso-divulgador')
    .classList.remove('hidden');

  ocultarMensagemDivulgador();
}


function mostrarMensagemDivulgador(texto) {
  const el = document.getElementById(
    'mensagem-divulgador'
  );

  el.textContent = texto;
  el.classList.remove('hidden');
}


function ocultarMensagemDivulgador() {
  const el = document.getElementById(
    'mensagem-divulgador'
  );

  el.textContent = '';
  el.classList.add('hidden');
}
function renderizarResultadosBusca(lista) {
  const area = document.getElementById(
    'resultados-busca'
  );

  if (!lista.length) {
    area.classList.add('hidden');
    return;
  }

  area.innerHTML = lista
    .map((pessoa, indice) => `
      <button
        type="button"
        class="resultado-pessoa"
        onclick="selecionarResultadoBusca(${indice})">

        <div class="resultado-nome">
          ${esc(pessoa.nome)}
        </div>

        <div class="resultado-detalhes">
          ${esc(pessoa.cidadeUf || '-')}
        </div>

        <div class="resultado-codigo">
          Código ${esc(pessoa.idDgmb)}
        </div>

      </button>
    `)
    .join('');

  area.dataset.resultados =
    JSON.stringify(lista);

  area.classList.remove('hidden');
}


function selecionarResultadoBusca(indice) {
  const area = document.getElementById(
    'resultados-busca'
  );

  let lista = [];

  try {
    lista = JSON.parse(
      area.dataset.resultados || '[]'
    );
  } catch (e) {
    lista = [];
  }

  const pessoa = lista[indice];

  if (!pessoa) return;

  selecionarPessoaMarketing(pessoa);
}


function selecionarPessoaMarketing(pessoa) {
  novoDivulgadorAtual = pessoa;

  limparResultadosBusca();
  ocultarMensagemDivulgador();

  document.getElementById(
    'novo-nome'
  ).textContent = pessoa.nome || '';

  document.getElementById(
    'novo-cidade'
  ).textContent = pessoa.cidadeUf || '';

  document.getElementById(
    'novo-whatsapp'
  ).textContent = pessoa.whatsapp || '';

  document
    .getElementById('etapa-busca-divulgador')
    .classList.add('hidden');

  document
    .getElementById('etapa-confirmar-divulgador')
    .classList.remove('hidden');
}


function limparResultadosBusca() {
  const area = document.getElementById(
    'resultados-busca'
  );

  if (!area) return;

  area.innerHTML = '';
  area.dataset.resultados = '';
  area.classList.add('hidden');
}
</script>
