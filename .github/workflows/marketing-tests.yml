name: Marketing e relacionamento — testes isolados
on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.html'
      - 'appsscript.json'
      - 'tests/**'
      - 'scripts/**'
      - '.gitignore'
      - '.clasp.json'
      - '.github/workflows/marketing-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (sem persistência de credenciais)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validar sintaxe e configuração
        run: |
          node --check Code.js
          node --check Planilhas.js
          node --check RelContatosService.js
          node --check RelEsporteService.js
          node --check Router.js
          node --check LabAutoteste.js
          node --check scripts/preparar-lab.cjs
          test ! -e .clasp.json
          node -e "const m=require('./appsscript.json');if(m.webapp.access!=='MYSELF')process.exit(1);"
      - name: Executar testes (nenhum dado real)
        run: |
          node tests/roteador_acesso_publico.test.js
          node tests/rel_contatos_pendencia.test.js
          node tests/marketing_desafios_recorte.test.js
          node tests/rel_esporte_campanhas.test.js
          node tests/rel_esporte_cache.test.js
          node tests/rel_whatsapp_campanhas.test.js
          node tests/lab_bundle.test.js
          node tests/lab_autoteste.test.js
          node tests/ref_reservados.test.js
          node tests/campanhas_etapas_dashboard.test.js
