name: Painel multidesafios — competência do desafio
on:
  pull_request:
    paths:
      - 'MarketingMultidesafios.js'
      - 'ScriptsMultidesafios.html'
      - 'Index.html'
      - 'tests/painel_competencia*.test.cjs'
      - '.github/workflows/painel-competencia-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  competencia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verificar sintaxe e regra de competência
        run: |
          node --check MarketingMultidesafios.js
          node --test tests/painel_competencia.test.cjs tests/painel_competencia_ui.test.cjs
