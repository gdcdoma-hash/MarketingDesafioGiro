name: Clean V3 - Marketing e Relacionamento
on:
  pull_request:
    paths:
      - 'v3/**'
      - 'scripts/preparar-v3-limpa.cjs'
      - 'tests/v3_clean.test.cjs'
      - 'tests/v3_ui_safety.test.cjs'
      - '.github/workflows/clean-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Testar V3 limpa sem acesso a dados reais
        run: |
          node --check scripts/preparar-v3-limpa.cjs
          node --test tests/v3_clean.test.cjs tests/v3_ui_safety.test.cjs
