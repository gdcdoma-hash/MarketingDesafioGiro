<style>

* {
  box-sizing: border-box;
}

:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
  --dark: #111827;
  --soft: #f3f4f6;
  --success: #15803d;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding:
    max(18px, env(safe-area-inset-top))
    16px
    max(28px, env(safe-area-inset-bottom));
}

.topo {
  margin-bottom: 16px;
}

.titulo {
  margin: 0;
  font-size: 28px;
  line-height: 1.15;
  font-weight: 800;
}

.subtitulo {
  margin-top: 6px;
  font-size: 15px;
  color: var(--muted);
}

.filtro-periodo {
  margin-top: 16px;
}

.filtro-periodo label {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .4px;
}

select {
  width: 100%;
  min-height: 54px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card);
  color: var(--text);
  font-size: 18px;
  outline: none;
}

.meta-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  margin-top: 16px;
}

.meta-topo {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
}

.meta-label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .35px;
}

.meta-numero {
  margin-top: 7px;
  font-size: 38px;
  line-height: 1;
  font-weight: 800;
}

.meta-percentual {
  font-size: 18px;
  color: var(--muted);
  font-weight: 700;
}

.barra {
  height: 10px;
  margin-top: 15px;
  background: var(--soft);
  border-radius: 999px;
  overflow: hidden;
}

.barra-preenchida {
  height: 100%;
  width: 0;
  background: var(--dark);
  border-radius: 999px;
  transition: width .25s ease;
}

.resumos {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 10px;
}

.resumo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
}

.resumo-numero {
  font-size: 34px;
  line-height: 1;
  font-weight: 800;
}

.resumo-label {
  margin-top: 8px;
  font-size: 15px;
  line-height: 1.3;
  color: var(--muted);
}

.navegacao {
  position: sticky;
  top: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin: 18px 0 14px;
  padding: 6px;
  background: rgba(244, 245, 247, .96);
  backdrop-filter: blur(6px);
}

.nav-btn {
  min-height: 52px;
  border: 0;
  border-radius: 13px;
  background: var(--soft);
  color: var(--text);
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
}

.nav-btn.ativa {
  background: var(--dark);
  color: #fff;
}

.secao {
  display: none;
}

.secao.ativa {
  display: block;
}

.secao-cabecalho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.secao-titulo {
  margin: 0;
  font-size: 19px;
  font-weight: 800;
}

.secao-info {
  font-size: 13px;
  color: var(--muted);
}

.card-origem {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 18px;
  margin-bottom: 12px;
}

.origem-topo {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.origem-info {
  min-width: 0;
  flex: 1;
}

.origem-nome {
  font-size: 19px;
  line-height: 1.25;
  font-weight: 800;
  word-break: break-word;
}

.origem-cidade {
  margin-top: 6px;
  font-size: 15px;
  color: var(--muted);
  line-height: 1.35;
}

.origem-tipo {
  display: inline-block;
  margin-top: 9px;
  padding: 6px 10px;
  background: var(--soft);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}

.origem-qtd {
  flex: 0 0 auto;
  text-align: right;
}

.origem-numero {
  font-size: 32px;
  line-height: 1;
  font-weight: 800;
}

.origem-legenda {
  margin-top: 5px;
  font-size: 12px;
  color: var(--muted);
}

.btn-copiar {
  width: 100%;
  min-height: 54px;
  margin-top: 14px;
  border: 0;
  border-radius: 13px;
  background: var(--dark);
  color: white;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
}

.btn-copiar:active {
  transform: scale(.99);
}

.btn-copiar.copiado {
  background: var(--success);
}

.carregando,
.vazio,
.erro {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 18px;
  text-align: center;
  color: var(--muted);
  font-size: 15px;
}

.erro {
  color: #b91c1c;
}

@media (min-width: 700px) {
  .resumos {
    grid-template-columns: 1fr 1fr;
  }

  .titulo {
    font-size: 30px;
  }
}
/* =========================================================
   MOBILE — ESCALA MAIOR PARA USO REAL NO CELULAR
   ========================================================= */

@media (max-width: 600px) {

  html {
    font-size: 18px;
  }

  body {
    width: 100%;
    min-width: 100%;
    font-size: 18px;
  }

  .app {
    width: 100%;
    max-width: none;
    margin: 0;
    padding:
      max(22px, env(safe-area-inset-top))
      18px
      max(32px, env(safe-area-inset-bottom));
  }

  /* TOPO */

  .titulo {
    font-size: 32px;
    line-height: 1.1;
  }

  .subtitulo {
    margin-top: 8px;
    font-size: 17px;
    line-height: 1.3;
  }

  .filtro-periodo {
    margin-top: 20px;
  }

  .filtro-periodo label {
    margin-bottom: 8px;
    font-size: 14px;
  }

  select {
    min-height: 62px;
    padding: 0 16px;
    font-size: 20px;
    border-radius: 15px;
  }

  /* META */

  .meta-card {
    margin-top: 18px;
    padding: 22px;
    border-radius: 19px;
  }

  .meta-label {
    font-size: 15px;
  }

  .meta-numero {
    margin-top: 8px;
    font-size: 46px;
  }

  .meta-percentual {
    font-size: 21px;
  }

  .barra {
    height: 12px;
    margin-top: 18px;
  }

  /* RESUMOS */

  .resumos {
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: 12px;
  }

  .resumo-card {
    padding: 21px;
    border-radius: 18px;
  }

  .resumo-numero {
    font-size: 42px;
  }

  .resumo-label {
    margin-top: 9px;
    font-size: 17px;
    line-height: 1.3;
  }

  /* NAVEGAÇÃO */

  .navegacao {
    gap: 8px;
    margin: 20px 0 18px;
    padding: 6px 0;
  }

  .nav-btn {
    min-height: 60px;
    border-radius: 14px;
    font-size: 18px;
  }

  /* TÍTULOS */

  .secao-cabecalho {
    margin-bottom: 13px;
  }

  .secao-titulo {
    font-size: 22px;
  }

  .secao-info {
    font-size: 15px;
  }

  /* CARDS DOS DIVULGADORES */

  .card-origem {
    padding: 21px;
    margin-bottom: 14px;
    border-radius: 19px;
  }

  .origem-topo {
    gap: 14px;
  }

  .origem-nome {
    font-size: 22px;
    line-height: 1.25;
  }

  .origem-cidade {
    margin-top: 7px;
    font-size: 17px;
    line-height: 1.4;
  }

  .origem-tipo {
    margin-top: 10px;
    padding: 7px 11px;
    font-size: 14px;
  }

  .origem-numero {
    font-size: 40px;
  }

  .origem-legenda {
    margin-top: 6px;
    font-size: 14px;
  }

  /* BOTÃO PRINCIPAL */

  .btn-copiar {
    min-height: 62px;
    margin-top: 17px;
    border-radius: 15px;
    font-size: 18px;
  }

  /* MENSAGENS */

  .carregando,
  .vazio,
  .erro {
    padding: 36px 20px;
    font-size: 17px;
  }
}
.hidden {
  display: none !important;
}

.acoes-topo {
  margin-top: 14px;
}

.btn-novo {
  width: 100%;
  min-height: 54px;
  border: 0;
  border-radius: 14px;
  background: var(--dark);
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
  background: rgba(17, 24, 39, .55);
}

.modal-card {
  width: 100%;
  max-width: 620px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 20px;
  border-radius: 22px 22px 16px 16px;
  background: #fff;
}

.modal-cabecalho {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}

.modal-titulo {
  font-size: 22px;
  font-weight: 800;
}

.modal-subtitulo {
  margin-top: 4px;
  color: var(--muted);
  font-size: 14px;
}

.modal-fechar {
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  border: 0;
  border-radius: 50%;
  background: var(--soft);
  color: var(--text);
  font-size: 27px;
  line-height: 1;
  cursor: pointer;
}

.campo-label {
  display: block;
  margin: 14px 0 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
}

.campo-input {
  width: 100%;
  min-height: 54px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
  color: var(--text);
  font-size: 18px;
}

.btn-principal,
.btn-secundario {
  width: 100%;
  min-height: 56px;
  margin-top: 14px;
  border: 0;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.btn-principal {
  background: var(--dark);
  color: #fff;
}

.btn-secundario {
  background: var(--soft);
  color: var(--text);
}

.pessoa-encontrada {
  padding: 16px;
  margin-bottom: 16px;
  border-radius: 15px;
  background: var(--soft);
}

.pessoa-nome {
  font-size: 20px;
  font-weight: 800;
}

.pessoa-detalhe {
  margin-top: 5px;
  color: var(--muted);
  font-size: 15px;
}

.mensagem-modal {
  margin-top: 14px;
  padding: 13px;
  border-radius: 12px;
  background: var(--soft);
  font-size: 14px;
  text-align: center;
}

@media (min-width: 700px) {
  .modal-overlay {
    align-items: center;
  }

  .modal-card {
    border-radius: 20px;
  }
}

.resultados-busca {
  margin-top: 12px;
}

.resultado-pessoa {
  width: 100%;
  margin-bottom: 8px;
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
  text-align: left;
  cursor: pointer;
}

.resultado-pessoa:active {
  background: var(--soft);
}

.resultado-nome {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
}

.resultado-detalhes {
  margin-top: 5px;
  font-size: 14px;
  line-height: 1.35;
  color: var(--muted);
}

.resultado-codigo {
  display: inline-block;
  margin-top: 7px;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

@media (max-width: 600px) {

  .resultado-pessoa {
    min-height: 74px;
    padding: 17px;
  }

  .resultado-nome {
    font-size: 19px;
  }

  .resultado-detalhes {
    font-size: 16px;
  }

  .resultado-codigo {
    font-size: 14px;
  }
}
</style>
